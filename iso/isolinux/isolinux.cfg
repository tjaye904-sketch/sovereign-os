UI menu.c32
PROMPT 0
TIMEOUT 50
DEFAULT sovereign

LABEL sovereign
  MENU LABEL Sovereign OS (live)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components username=sovereign quiet

LABEL sovereign-verbose
  MENU LABEL Sovereign OS (verbose)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components username=sovereign
