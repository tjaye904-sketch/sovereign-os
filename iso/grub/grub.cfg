set default=0
set timeout=5

menuentry "Sovereign OS (live)" {
    linux /live/vmlinuz boot=live components username=sovereign quiet splash
    initrd /live/initrd.img
}

menuentry "Sovereign OS (live, verbose)" {
    linux /live/vmlinuz boot=live components username=sovereign
    initrd /live/initrd.img
}

menuentry "Sovereign OS (safe graphics)" {
    linux /live/vmlinuz boot=live components username=sovereign nomodeset
    initrd /live/initrd.img
}
