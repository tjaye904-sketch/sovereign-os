id: research.web_collect
description: Open allowlisted docs URL, snapshot text, browser screenshot (headed)
version: 1
risk: low
steps:
  - action: browser_open
    args:
      url: "${url:-https://docs.python.org/3/}"
  - action: browser_snapshot
    args:
      max_chars: 4000
  - action: browser_screenshot
    args:
      name: purpose_research.web_collect.png
